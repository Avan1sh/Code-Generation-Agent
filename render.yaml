# Render blueprint. Free tier: no card, 750 compute-hours/month, sleeps after
# 15 minutes idle with a 30-60s cold start (the UI handles that explicitly).
#
# GROQ_API_KEY is deliberately NOT listed here -- sync:false means Render
# prompts for it and stores it as a secret rather than keeping it in this file,
# which is committed to a public repo.
services:
  - type: web
    name: selfcorrect-agent-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: DAILY_CALL_BUDGET
        value: "400"
      # Free-tier CPU is a fraction of a core; the 10s default is far too tight
      # there and makes valid solutions report timed_out. /api/status exposes the
      # measured probe duration so this can be tuned from data, not guessed.
      - key: SANDBOX_TIMEOUT_SEC
        value: "45"
      # The free instance has 512MB total. An RLIMIT_AS above that protects
      # nothing: the sandbox child can grow until the CONTAINER is OOM-killed,
      # which takes the server down mid-response and surfaces as HTTP 200 with
      # an empty body. The ceiling must sit below the container's own budget.
      - key: SANDBOX_MEMORY_MB
        value: "300"
      - key: GROQ_API_KEY
        sync: false
