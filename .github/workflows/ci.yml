name: tests

# Runs on Linux, which is the point. The POSIX resource-limit path in
# agent/sandbox.py (RLIMIT_AS / RLIMIT_CPU / RLIMIT_NPROC) does not exist on
# Windows, where this project was developed, so tests/test_sandbox_posix.py was
# permanently skipped and the memory and CPU ceilings stayed a design claim
# rather than a measured one. Here those tests actually execute.
#
# No API key is required: every test in the suite is deterministic and
# key-free by design. LLM output quality is measured by eval/run_eval.py, which
# is deliberately not run in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        # Both files: serve/ is part of the project and its tests import FastAPI.
        # Installing only the core requirements made the server tests fail on the
        # runner while passing locally, where FastAPI happened to be present.
        run: |
          pip install -r requirements.txt
          pip install -r serve/requirements.txt

      - name: Confirm the POSIX sandbox path is reachable here
        run: |
          python - <<'PY'
          import sys
          from agent.sandbox import verify_sandbox_health, DEFAULT_TIMEOUT_SEC
          assert sys.platform != "win32", "expected a POSIX runner"
          probe = verify_sandbox_health()
          print(f"POSIX limits active; probe {probe:.1f}s of a {DEFAULT_TIMEOUT_SEC}s budget")
          PY

      - name: Deployment memory ceiling must still permit valid code
        # The hosted demo runs on a 512MB instance, so SANDBOX_MEMORY_MB is set
        # to 300 there -- a ceiling above the container's own budget protects
        # nothing. Windows cannot check this (RLIMIT_AS is inert), so Linux CI is
        # the only place it can be validated before deploying. If 300MB is too
        # tight for CPython plus pydantic-core, this fails here rather than
        # silently breaking every run in production.
        env:
          SANDBOX_MEMORY_MB: "300"
        run: |
          python - <<'PY'
          from agent.sandbox import verify_sandbox_health, DEFAULT_MEMORY_MB
          probe = verify_sandbox_health()
          print(f"OK: valid code runs under a {DEFAULT_MEMORY_MB}MB RLIMIT_AS ({probe:.1f}s)")
          PY

      - name: Full suite
        run: pytest -q

      - name: POSIX sandbox tests must RUN, not skip
        # A skipped test still exits 0, so "CI is green" would not prove these
        # executed -- which is exactly how they went unrun for the whole project.
        # This step fails the build if pytest reports any skip in that file.
        run: |
          set -o pipefail
          pytest tests/test_sandbox_posix.py -v --no-header -rs | tee posix.log
          if grep -qi "skipped" posix.log; then
            echo "::error::POSIX sandbox tests were SKIPPED - the ceilings remain unverified"
            exit 1
          fi
          echo "POSIX sandbox tests executed (no skips)"
